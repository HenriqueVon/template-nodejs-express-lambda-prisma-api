<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Service API documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.35.1/swagger-ui.css">
  <style>
    body { margin: 0; }
    .banner { padding: 12px 20px; background: #1f2937; color: #e5e7eb; font: 14px/1.5 system-ui, sans-serif; }
    .banner a { color: #93c5fd; }
    /* The server list points to localhost, which means nothing on a static page */
    .swagger-ui .scheme-container { display: none; }
  </style>
</head>
<body>
  <div class="banner">
    Static preview of the OpenAPI document generated from the template. "Try it out" is disabled because there
    is no server behind this page.
    <a href="https://github.com/HenriqueVon/template-nodejs-express-lambda-prisma-api">View the template on GitHub</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.35.1/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: './openapi.json',
      dom_id: '#swagger-ui',
      supportedSubmitMethods: [],
      docExpansion: 'list',
      deepLinking: true
    });
  </script>
</body>
</html>
