# Publishes the OpenAPI document of the template as a static Swagger UI page on GitHub Pages.
# Template repository only: `npm run init` deletes this file. One-time setup in the repository:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish API docs

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/pages/**"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # The document is built from the code; the variables only satisfy config/env.ts, nothing connects to a database.
      # config/env.ts validates them, so the key needs at least 16 characters even though it is not real.
      - name: Generate the OpenAPI document
        run: npm run docs:openapi -- site/openapi.json
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/docs
          API_KEY: not-a-real-key-only-for-the-docs-build

      - name: Add the page
        run: cp .github/pages/index.html site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
