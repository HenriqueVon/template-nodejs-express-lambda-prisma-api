name: Deploy My Service API

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# @template:only:start
# The migrate and deploy jobs skip a repository marked as a GitHub template (`is_template`), which has no
# environments or secrets: the template repository itself only runs `validate`. A repository created from
# the template is not a template, so it gets the full pipeline.
# @template:only:end
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check:ts

      - name: Run tests
        run: npm run test:run

  migrate-dev:
    needs: validate
    if: github.ref == 'refs/heads/develop' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: migrate-dev
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:prod
        env:
          # Direct endpoint: a connection pooler (PgBouncer) can break the schema engine. The Lambda uses DATABASE_URL.
          # If the database has no pooler, set DIRECT_DATABASE_URL to the same value as DATABASE_URL.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  deploy-dev:
    needs: [validate, migrate-dev]
    if: github.ref == 'refs/heads/develop' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to dev
        run: npx serverless deploy --stage dev
        env:
          NODE_ENV: development
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}

  migrate-prod:
    needs: validate
    if: github.ref == 'refs/heads/main' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    environment: prd
    concurrency:
      group: migrate-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:prod
        env:
          # Direct endpoint: a connection pooler (PgBouncer) can break the schema engine. The Lambda uses DATABASE_URL.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  deploy-prod:
    needs: [validate, migrate-prod]
    if: github.ref == 'refs/heads/main' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    environment: prd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to prod
        run: npx serverless deploy --stage prod
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
