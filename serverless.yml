service: my-service-api

frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  region: sa-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 256
  timeout: 15
  logRetentionInDays: 14

  deploymentBucket:
    name: my-service-api-deployments-${self:provider.stage}
    blockPublicAccess: true
    serverSideEncryption: AES256

  iam:
    role:
      name: my-service-api-${self:provider.stage}-${self:provider.region}-lambdaRole

  # Every variable the Lambda reads must be listed here, in .env.example and in config/env.ts. A required
  # variable also goes in the deploy jobs of .github/workflows/deploy.yml; an optional one with a default,
  # like DB_POOL_MAX, needs them only to be overridden.
  environment:
    NODE_ENV: ${env:NODE_ENV}
    DATABASE_URL: ${env:DATABASE_URL}
    API_KEY: ${env:API_KEY}
    DB_POOL_MAX: ${env:DB_POOL_MAX, "2"}

functions:
  api:
    handler: src/handler.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

# Ceiling of the whole HTTP API, shared by every route and every caller: above it, API Gateway answers 429
# before the Lambda runs, which protects the database from a burst. Tune both numbers to the traffic of the
# service (requests per second, and requests accepted at once).
resources:
  extensions:
    HttpApiStage:
      Properties:
        # Replaces the generated object, so the generated DetailedMetricsEnabled is repeated here
        DefaultRouteSettings:
          DetailedMetricsEnabled: false
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-prune-plugin

custom:
  serverless-offline:
    httpPort: 3000

  esbuild:
    bundle: true
    exclude:
      - "@aws-sdk/*"
    external:
      - aws-sdk
    minify: false
    sourcemap: true
    target: node24
    platform: node

  prune:
    automatic: true
    number: 3

package:
  patterns:
    - "!**/*.test.*"
    - "!**/*.spec.*"
    - "!test/**"
    - "!tests/**"
    - "!coverage/**"
    - "!docs/**"
    - "!.git/**"
    - "!.github/**"
    - "!README.md"
    - "!node_modules/.cache/**"
    - "!*.log"
    - "!vitest.config.*"
    - "!eslint.config.*"
    - "!tsconfig*.json"
    - "!serverless.yml"
    - "!.env*"
  individually: true
  excludeDevDependencies: true
